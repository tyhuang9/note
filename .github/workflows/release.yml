name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            os: windows-latest
          - name: macOS installers
            os: macos-latest
          - name: Linux installers
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo apt-get install -y --no-install-recommends libfuse2 \
            || sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || echo "FUSE compatibility package unavailable; AppImage packaging may fail."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "backend/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run Rust tests
        working-directory: backend/src-tauri
        run: cargo test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri installers
        if: matrix.os != 'ubuntu-latest'
        run: npm run tauri:build

      - name: Build Tauri installers (Linux full bundle)
        id: linux_full_bundle
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build

      - name: Build Debian package fallback
        if: matrix.os == 'ubuntu-latest' && steps.linux_full_bundle.outcome == 'failure'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build -- --bundles deb

      - name: Record Linux AppImage warning
        if: matrix.os == 'ubuntu-latest' && steps.linux_full_bundle.outcome == 'failure'
        run: |
          echo "Full Linux bundle failed. Built Debian package fallback; AppImage may be absent." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=AppImage not guaranteed::Full Linux bundle failed; Debian fallback was built. Check logs for linuxdeploy/AppImage details."

      - name: Upload Windows installers
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: note-windows-installers
          if-no-files-found: error
          path: |
            backend/src-tauri/target/release/bundle/msi/*.msi
            backend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installers
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: note-macos-installers
          if-no-files-found: error
          path: |
            backend/src-tauri/target/release/bundle/dmg/*.dmg
            backend/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Linux installers
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: note-linux-installers
          if-no-files-found: error
          path: |
            backend/src-tauri/target/release/bundle/deb/*.deb
            backend/src-tauri/target/release/bundle/appimage/*.AppImage
            backend/src-tauri/target/release/bundle/rpm/*.rpm
