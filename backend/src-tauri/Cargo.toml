[package]
name = "note"
version = "0.1.0"
description = "A lightweight desktop note-taking app for freeform thinking."
authors = ["tyhuang"]
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop-notifications"]
desktop-notifications = ["dep:tauri-plugin-notification"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
tempfile = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
icalendar = { version = "0.17.12", default-features = false, features = ["parser"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }
iana-time-zone = "0.1"
getrandom = "0.3"
sha2 = "0.10"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = { version = "=2.3.3", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
cpal = "0.15"
hound = "3.5"
tauri-plugin-global-shortcut = "2"
