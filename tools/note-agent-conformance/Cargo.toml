[workspace]

[package]
name = "note-agent-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
jsonschema = { version = "0.37", default-features = false }
llama-harness = { git = "https://github.com/tyhuang9/llama-harness", rev = "59e7c49b2a452faac31dac10205f75d97d88a5e5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
